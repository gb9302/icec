name: icec-lab-next-v03

services:
  web:
    build: .
    container_name: icec-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    container_name: icec-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-icec}:${POSTGRES_PASSWORD:-icec_local_change_me}@db:5432/${POSTGRES_DB:-icec}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: icec-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icec}
      POSTGRES_USER: ${POSTGRES_USER:-icec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icec_local_change_me}
    volumes:
      - icec_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icec} -d ${POSTGRES_DB:-icec}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  icec_postgres_data:
